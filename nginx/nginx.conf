upstream api_pool {
    least_conn;                    # melhor que round-robin quando as conexões duram tempos diferentes
    server api_1:8000 max_fails=3 fail_timeout=10s;
    server api_2:8000 max_fails=3 fail_timeout=10s;
    server api_3:8000 max_fails=3 fail_timeout=10s;
    server api_4:8000 max_fails=3 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_pool;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ws {                                     # exato: /ws/ (com barra) não é a rota do WS
        proxy_pass http://api_pool;
        proxy_http_version 1.1;                          # HTTP/1.0 não faz upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout  3600s;                       # default 60s mataria o WS ocioso
        proxy_send_timeout  3600s;
    }
}
